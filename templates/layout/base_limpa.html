<!DOCTYPE html>
<html lang="pt-BR">
<!-- Cabecalho HTML: metadados, titulo da aba e inclusao de estilos/scripts. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><!-- Bloco Jinja que pode ser preenchido ou sobrescrito pelos templates que herdam este layout. -->
{% block titulo_aba %}HD2R | Cadastro de Munícipes{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Bloco Jinja que pode ser preenchido ou sobrescrito pelos templates que herdam este layout. -->
{% block estilos %}{% endblock %}
</head>
<body>
    <!-- Conteúdo central da página. -->
    <!-- Conteudo principal: os templates filhos inserem seu conteudo nesta area. -->
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="col-12 col-md-8 col-lg-5">
            <!-- Loop Jinja: repete o conteúdo para cada registro da lista. -->
            <!-- Percorre as mensagens ou itens para renderizar cada um. -->
{% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
            <div class="alert alert-{{ categoria }} alert-dismissible fade show" role="alert">
                {{ mensagem }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>
            {% endfor %}
            <!-- Bloco Jinja que pode ser preenchido ou sobrescrito pelos templates que herdam este layout. -->
{% block conteudo %}{% endblock %}
        </div>
    </main>
    <!-- Código JavaScript executado no navegador. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bloco Jinja que pode ser preenchido ou sobrescrito pelos templates que herdam este layout. -->
{% block scripts %}{% endblock %}
</body>
</html>
