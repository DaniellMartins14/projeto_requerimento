<!-- Pagina de erro 500: exibida quando ocorre um erro inesperado no servidor. -->
<!-- Página exibida quando ocorre um erro interno no servidor (erro 500). Os comentários seguintes explicam a estrutura e os blocos principais. -->
{% extends "layout/base_limpa.html" %}
{% block titulo_aba %}Erro interno | HD2R{% endblock %}
{% block conteudo %}
<div class="card p-5 text-center">
    <div class="display-1 fw-bold text-danger">500</div>
    <!-- Titulo/mensagem principal da pagina de erro. -->
<h1 class="h3">Erro interno do servidor</h1>
    <p class="text-secondary">Ocorreu um problema inesperado. Tente novamente em alguns instantes.</p>
    <!-- Link para o usuario voltar a uma pagina utilizavel. -->
<a href="{{ url_for('index') if session.get('municipe_id') else url_for('login') }}" class="btn btn-verde">Voltar</a>
</div>
{% endblock %}
